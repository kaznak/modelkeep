name: Release OCI image

on:
  pull_request:
    paths:
      - ".github/workflows/release-image.yml"
      - "Cargo.toml"
      - "Cargo.lock"
      - "flake.nix"
      - "flake.lock"
      - "compose.yaml"
      - "src/**"
      - "upstream/**"
      - "tests/**"
  push:
    branches:
      - main
    tags:
      - "v*"
    # GitHub does not evaluate path filters for tag pushes, so every v* release
    # still builds and publishes both architectures.
    paths:
      - ".github/workflows/release-image.yml"
      - "Cargo.toml"
      - "Cargo.lock"
      - "flake.nix"
      - "flake.lock"
      - "compose.yaml"
      - "src/**"
      - "upstream/**"
      - "tests/**"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  IS_RELEASE: ${{ startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch' }}

jobs:
  build:
    name: Build ${{ matrix.arch }} image
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            nix_system: x86_64-linux
            runner: ubuntu-latest
          - arch: arm64
            nix_system: aarch64-linux
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@v22

      - name: Run flake checks on ${{ matrix.arch }}
        run: nix flake check

      - name: Build OCI image from flake
        run: nix build .#packages.${{ matrix.nix_system }}.modelkeep-image

      - name: Load image into Docker
        if: env.IS_RELEASE == 'true'
        run: docker load < result

      - name: Log in to GHCR
        if: env.IS_RELEASE == 'true'
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tag and push architecture image
        if: env.IS_RELEASE == 'true'
        env:
          VERSION: ${{ startsWith(github.ref_name, 'v') && github.ref_name || format('sha-{0}', github.sha) }}
        run: |
          IMAGE="${REGISTRY}/${IMAGE_NAME,,}"
          docker tag modelkeep:0.3.0 "${IMAGE}:${VERSION}-${{ matrix.arch }}"
          docker push "${IMAGE}:${VERSION}-${{ matrix.arch }}"

  manifest:
    name: Publish multi-arch manifest
    needs: build
    if: needs.build.result == 'success' && (startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    steps:
      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish versioned manifest
        env:
          VERSION: ${{ startsWith(github.ref_name, 'v') && github.ref_name || format('sha-{0}', github.sha) }}
        run: |
          IMAGE="${REGISTRY}/${IMAGE_NAME,,}"
          docker buildx imagetools create \
            --tag "${IMAGE}:${VERSION}" \
            "${IMAGE}:${VERSION}-amd64" \
            "${IMAGE}:${VERSION}-arm64"
