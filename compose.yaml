services:
  modelkeep:
    # Build and tag the image from the Nix flake before deployment.
    # Keep this tag pinned to a released version or Git commit; do not use latest.
    image: ${MODELKEEP_IMAGE_REPOSITORY:-modelkeep}:${MODELKEEP_IMAGE_TAG:-0.2.0}
    restart: unless-stopped
    read_only: true
    user: "10001:10001"
    ports:
      # Tailscale Serve runs on the QNAP host and is the only supported ingress.
      # Do not change this to 8090:8090: that would also expose ModelKeep on the LAN.
      - "127.0.0.1:8090:8090"
    volumes:
      # Change the host path to the QNAP share reserved for ModelKeep.
      - /share/LLM/modelkeep:/data
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD", "/bin/modelkeep", "ready"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    security_opt:
      - no-new-privileges:true
    environment:
      RUST_LOG: ${RUST_LOG:-info}
      HF_HOME: /tmp/huggingface
      # Optional service token for private or gated upstream repositories.
      HF_TOKEN: ${HF_TOKEN:-}
