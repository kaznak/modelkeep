# Ready to use on QNAP after changing the archive share below when necessary.
# Tailscale runs on the QNAP host, not in this container. After startup, run:
#   tailscale serve --bg http://127.0.0.1:8090
#   tailscale serve status
services:
  modelkeep:
    # Keep this literal for QNAP Container Station, which does not expand Compose
    # default-value expressions consistently when creating an Application.
    image: ghcr.io/kaznak/modelkeep:v0.2.0
    restart: unless-stopped
    read_only: true
    user: "10001:10001"
    ports:
      # Tailscale Serve runs on the QNAP host and is the only supported ingress.
      # Do not change this to 8090:8090: that would also expose ModelKeep on the LAN.
      - "127.0.0.1:8090:8090"
    volumes:
      # Change the host path to the QNAP share reserved for ModelKeep.
      - /share/LLM/modelkeep:/data
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD", "/bin/modelkeep", "ready"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    security_opt:
      - no-new-privileges:true
    environment:
      RUST_LOG: info
      HF_HOME: /tmp/huggingface
      # For private or gated upstream repositories, replace the empty value with a
      # token supplied through QNAP's protected deployment configuration.
      HF_TOKEN: ""
