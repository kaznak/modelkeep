# Before first use with a new archive share, run compose.init.yaml as a separate
# one-shot QNAP Application and remove it after exit code 0.
# Ready to use on QNAP after changing the archive share below when necessary.
# Tailscale runs on the QNAP host, not in this container. After startup, run:
#   tailscale serve --service=svc:modelkeep --bg http://127.0.0.1:8090
#   tailscale serve --service=svc:modelkeep-admin --accept-app-caps=io.modelkeep/cap/admin --bg http://127.0.0.1:8091
#   tailscale serve status
services:
  modelkeep:
    container_name: modelkeep
    # Keep this literal for QNAP Container Station, which does not expand Compose
    # default-value expressions consistently when creating an Application.
    image: ghcr.io/kaznak/modelkeep:v0.4.1
    restart: unless-stopped
    read_only: true
    user: "10001:10001"
    ports:
      # Tailscale Serve runs on the QNAP host and is the only supported ingress.
      # Do not change this to 8090:8090: that would also expose ModelKeep on the LAN.
      - "127.0.0.1:8090:8090"
      # Management API/UI ingress is a separate Tailscale Service and grant.
      - "127.0.0.1:8091:8091"
    volumes:
      # Change the host path to the QNAP share reserved for ModelKeep.
      - /share/Services/modelkeep:/data
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD", "/bin/modelkeep", "ready"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    security_opt:
      - no-new-privileges:true
    environment:
      RUST_LOG: info
      MODELKEEP_ADMIN_ADDRESS: "0.0.0.0:8091"
      MODELKEEP_TRUST_TAILSCALE_HEADERS: "true"
      HF_HOME: /tmp/huggingface
      # For private or gated upstream repositories, replace the empty value with a
      # token supplied through QNAP's protected deployment configuration.
      HF_TOKEN: ""
